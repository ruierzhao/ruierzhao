name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""                                          # ① 不渲染基础卡，只留插件

          plugin_stargazers: yes                            # ② 启用 stargazers 插件
          plugin_stargazers_charts: no                      # ③ 关掉默认折线/柱状图
          plugin_stargazers_worldmap: yes                   # ④ 开启世界地图
          plugin_stargazers_worldmap_token: ${{ secrets.GOOGLE_MAP_TOKEN }}  # ⑤ Google 地理编码 token
          plugin_stargazers_worldmap_sample: 200            # ⑥ 采样 200 人，控制 API 调用量


